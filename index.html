 const parts=[{text:p}];for(const b of (o.images||[]))parts.push({inline_data:{mime_type:b.type||'image/jpeg',data:await b64(b)}});
 const body={contents:[{parts}]};if(o.json)body.generationConfig={responseMimeType:'application/json'};
 let r,j;try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+md+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify(body)});j=await r.json()}catch(e){throw{code:'net',message:'No hay conexión con Gemini. Revisa tu internet.'}}
 if(!r.ok)throw{code:'api',status:r.status,message:((j.error&&j.error.message)||'Error')+' (código '+r.status+')'};

async function zip(d){if(!window.JSZip)throw new Error('No cargó el programa de ZIP.');const z=new JSZip();z.file('01-fondo.png',await mkFondo('#ff9a3c','#d9480f'));z.file('02-marco.png',await mkMarco('#ffffff',60,'polaroid'));z.file('03-sticker.png',await mkSt('❤️'));z.file('04-hoja.txt',sheet(d));return z.generateAsync({type:'blob'})}
const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('No se pudo leer una imagen'));r.readAsDataURL(f)});
const du2b=u=>{const a=u.split(','),m=a[0].match(/:(.*?);/)[1],bs=atob(a[1]),u8=new Uint8Array(bs.length);for(let i=0;i<bs.length;i++)u8[i]=bs.charCodeAt(i);return new Blob([u8],{type:m})};
async function shrink(f){const src=await rd(f);
 try{const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(0);i.src=src}),W=im.naturalWidth||im.width,H=im.naturalHeight||im.height,k=Math.min(1,2000/Math.max(W,H)),c=cv(Math.round(W*k),Math.round(H*k));
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.92);
  if(u.length>200)return{blob:du2b(u),url:u}}catch(e){}

const T={};
T['Analizar']=m=>{let files=[];
